<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Connect with Tan — AWExpedition™</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F3EE;
    --warm-white: #FDFAF6;
    --bark: #2C2017;
    --moss: #4A5C3E;
    --clay: #B5714A;
    --sand: #D4B896;
    --mist: #E8E0D5;
    --gold: #C9943A;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bark);
    color: var(--bark);
    font-family: 'DM Sans', Georgia, serif;
    font-weight: 300;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--bark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .hero {
    background: var(--cream);
    padding: 3rem 2rem 2.5rem;
    text-align: center;
  }
  .hero img.logo {
    width: 84px;
    height: 84px;
    object-fit: contain;
    margin-bottom: 1rem;
  }
  .hero img.headshot {
    width: 84px;
    height: 84px;
    object-fit: cover;
    border-radius: 50%;
    margin: 0 0 1.2rem;
    border: 2px solid var(--warm-white);
  }
  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 400;
    color: var(--bark);
    margin-bottom: 0.6rem;
  }
  .hero .role {
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8a6a4a;
    margin-bottom: 0.3rem;
  }
  .hero .brand {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--clay);
  }

  .intro {
    padding: 1.75rem 1.75rem 0.5rem;
    text-align: center;
  }
  .intro p {
    font-size: 0.92rem;
    color: var(--cream);
    opacity: 0.85;
    line-height: 1.75;
  }

  .links {
    padding: 1.25rem 1.75rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background: var(--cream);
    color: var(--bark);
    text-align: center;
    padding: 0.95rem;
    border-radius: 4px;
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    font-family: 'DM Sans', sans-serif;
    border: none;
    cursor: pointer;
    width: 100%;
    transition: transform 0.15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn.primary {
    background: var(--clay);
    color: var(--cream);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 400;
  }
  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  footer {
    margin-top: auto;
    background: var(--bark);
    color: var(--cream);
    padding: 2rem 1.75rem;
  }
</style>
</head>
<body>

<div class="card">

  <div class="hero">
    <img class="logo" src="Logo_Elevated.png" alt="AWExpedition compass logo">
    <img class="headshot" src="Play_3.jpg" alt="Tan Cheung">
    <h1>Connect with Tan</h1>
    <p class="role">Awareness &amp; Alignment™ Coach</p>
    <p class="brand">AWExpedition™</p>
  </div>

  <div class="intro">
    <p>Thank you for connecting. Here are the easiest ways to learn more, book a conversation, or stay in touch.</p>
  </div>

  <div class="links">

    <button class="btn primary" onclick="downloadVCard()">Save Contact</button>

    <a href="https://awexpedition.com/" class="btn">Visit AWExpedition</a>

    <a href="https://www.linkedin.com/in/tanyee-cheung-esq-43a2a710/" class="btn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#2C2017"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.95v5.66H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
      LinkedIn
    </a>

    <a href="mailto:tan@awexpedition.com" class="btn">Email Tan</a>

    <a href="tel:9295001559" class="btn">Call or Text · 929-500-1559</a>

  </div>

</div>

<div id="site-footer"></div>
<script>
  fetch('/footer.html')
    .then(r => r.text())
    .then(html => document.getElementById('site-footer').innerHTML = html);

  function downloadVCard() {
    const vcard = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Cheung;Tan;;;',
      'FN:Tan Cheung',
      'ORG:AWExpedition',
      'TITLE:Awareness & Alignment Coach',
      'EMAIL;TYPE=INTERNET:tan@awexpedition.com',
      'TEL;TYPE=CELL:929-500-1559',
      'URL:https://awexpedition.com/',
      'NOTE:Awareness & Alignment Coaching | Awareness \\u2022 Wonder \\u2022 Embodiment',
      'END:VCARD'
    ].join('\r\n');
    const blob = new Blob([vcard], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Tan-Cheung-AWExpedition.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
